
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Test FastAPI and PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: medication_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: medication_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medication_app -d medication_inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DB_USER: medication_app
      DB_PASSWORD: ci_test_password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: medication_inventory_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -v
